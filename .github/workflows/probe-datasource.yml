name: probe-datasource

# Proves -- before anyone pays for anything -- whether the award data source is
# reachable and what its API actually returns.
#
# This exists because the Claude session that wrote this repository runs behind
# a strict network egress allowlist and cannot reach seats.aero, any airline, or
# any award aggregator. GitHub's runners have no such restriction, so this is
# the only honest way to validate the client: run it here and read the output.
#
# Everything is written to stdout as well as the step summary. The summary is
# only readable by a human in a browser; the job log is readable through the
# API, which is what an unattended check-in has to work from.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-datasource.yml"
      - "scripts/probe_contract.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reachability
        run: |
          say() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          say "### Reachability from a GitHub runner"
          say ""
          say "| Host | HTTP | Verdict |"
          say "|---|---|---|"
          for host in seats.aero developers.seats.aero docs.seats.aero \
                      www.virginatlantic.com www.qatarairways.com \
                      www.britishairways.com www.etihad.com; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" 2>/dev/null || echo "000")
            case "$code" in
              000) verdict="UNREACHABLE" ;;
              2*|3*) verdict="reachable" ;;
              4*|5*) verdict="responded ($code)" ;;
              *) verdict="?" ;;
            esac
            say "| $host | $code | $verdict |"
          done

      - name: Partner API contract
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
        run: |
          say() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          say ""
          say "### Partner API contract"
          say ""

          # Guarded in the shell, not in `if:` -- the secrets context is not
          # available to step-level conditions, and referencing it there
          # invalidates the entire workflow file.
          if [ -z "$SEATS_AERO_API_KEY" ]; then
            say "No \`SEATS_AERO_API_KEY\` secret set, so the authenticated endpoint"
            say "was not called. The reachability table above still answers whether"
            say "a key would be usable from here."
            exit 0
          fi

          url="https://seats.aero/partnerapi/search?origin_airport=BOM&destination_airport=ORD&start_date=2027-05-04&end_date=2027-05-05&take=3"
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 30 \
                 -H "Partner-Authorization: $SEATS_AERO_API_KEY" \
                 -H "Accept: application/json" "$url" || echo "000")

          say "HTTP status: \`$code\`"
          say ""
          say '```'
          python3 scripts/probe_contract.py /tmp/probe.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say '```'

      - name: End-to-end run against live data
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
        run: |
          say() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if [ -z "$SEATS_AERO_API_KEY" ]; then
            say "No key set; the live pipeline run was skipped."
            exit 0
          fi

          pip install -r requirements.txt
          say ""
          say "### Full pipeline against live availability"
          say ""
          say '```'
          python -m awardwatch --dry-run --optimize cash 2>&1 | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          say '```'
