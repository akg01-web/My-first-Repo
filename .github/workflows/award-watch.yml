name: award-watch

on:
  schedule:
    # Hourly. Virgin, Qatar and Etihad all price dynamically, and the baseline
    # needs 24+ observations over 48+ hours per slot before it will call
    # anything a deal, so cadence is what makes the flagging trustworthy.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report without updating the issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: award-watch
  cancel-in-progress: false

jobs:
  poll:
    # A scheduled workflow can end up registered against a branch other than
    # the default one, and then keeps running there against whatever stale code
    # that branch holds. That is not hypothetical: five hourly runs executed on
    # a merged feature branch and committed 55 rows of fixture data as if they
    # were real observations. Pin the job to the default branch so a stale
    # branch cannot resurrect old code on a timer.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_awardwatch.py

      - name: Poll award availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional. Without it the run falls back to chart estimates plus
          # the manual-search links, which still works.
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
        run: |
          python -m awardwatch \
            --out docs/award-watch.md \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit report and state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The report embeds a timestamp, so it differs every hour whether or
          # not anything was observed. Commit only when the observation log
          # actually grew -- otherwise main collects 24 empty commits a day.
          git add -A data/observations.csv
          if git diff --staged --quiet; then
            echo "No new observations this run; nothing to commit."
            git reset -q
          else
            git add -A docs/award-watch.md .awardwatch_state.json
            git commit -m "award-watch: hourly observation $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
