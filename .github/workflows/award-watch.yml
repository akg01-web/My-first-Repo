name: award-watch

on:
  schedule:
    # Hourly. Virgin, Qatar and Etihad all price dynamically, and the baseline
    # needs 24+ observations over 48+ hours per slot before it will call
    # anything a deal, so cadence is what makes the flagging trustworthy.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report without updating the issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: award-watch
  cancel-in-progress: false

jobs:
  poll:
    # GitHub runs scheduled workflows ONLY on the repository's default branch.
    # Hardcoding a branch name here is a trap: this repository's default branch
    # is not "main", so an earlier version of this guard compared against a
    # branch the scheduler never uses, and would have disabled the poll
    # permanently while looking like a safety measure.
    #
    # Comparing against the default branch reported in the event payload is
    # self-correcting -- it stays right if the default branch is ever renamed.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_awardwatch.py

      - name: Poll award availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional. Without it the run falls back to chart estimates plus
          # the manual-search links, which still works.
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
        run: |
          python -m awardwatch \
            --out docs/award-watch.md \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit report and state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_if_observed.sh \
            data/observations.csv docs/award-watch.md .awardwatch_state.json

      - name: Verify the commit step's own logic
        run: bash tests/test_commit_step.sh
